server {
    # Listen on port 80 for all incoming requests, regardless of hostname/domain
    listen 80;
    server_name _;

    # Directory where the built React app (Vite's dist output) lives
    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    # Reduces payload size for text-based assets before sending to the browser
    gzip on;
    gzip_vary on;              # Adds "Vary: Accept-Encoding" header, needed for correct caching by proxies/CDNs
    gzip_min_length 1024;      # Don't bother compressing tiny files — overhead isn't worth it
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # --- Security headers ---
    # "always" ensures these are added even on error responses (4xx/5xx), not just 200s
    add_header X-Content-Type-Options "nosniff" always;       # Stops browsers from guessing/overriding MIME types
    add_header X-Frame-Options "SAMEORIGIN" always;           # Prevents this site from being embedded in an <iframe> on other domains (clickjacking protection)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # Limits how much referrer info leaks to other sites

    # --- Caching rules ---
    # index.html must NEVER be cached long-term, because it references
    # fingerprinted asset filenames (e.g. app.a1b2c3.js). If a browser caches
    # an old index.html, it'll request assets that no longer exist after a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints filenames based on content hash, so these are safe
    # to cache aggressively — a new build produces a new filename, never
    # overwriting an old cached one.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;   # Skip logging every asset request — reduces log noise/disk usage
    }

    # --- SPA routing ---
    # Try to serve the exact file requested, then a matching directory,
    # and if neither exists, fall back to index.html. This is what makes
    # client-side routes (e.g. /dashboard, /settings) work on direct load
    # or refresh, instead of nginx returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}